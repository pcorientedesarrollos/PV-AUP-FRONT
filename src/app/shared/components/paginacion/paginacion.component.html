<div class="px-4 py-3 bg-white border-t border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 rounded-b-xl">

  <!-- Info de resultados -->
  <p class="text-sm text-gray-500 order-2 sm:order-1">
    Mostrando
    <span class="font-semibold text-gray-800">{{ rangoInicio() }}</span>
    a
    <span class="font-semibold text-gray-800">{{ rangoFin() }}</span>
    de
    <span class="font-semibold text-gray-800">{{ totalRegistros }}</span>
    resultados
  </p>

  <!-- Navegación de páginas -->
  <nav class="inline-flex items-center gap-1 order-1 sm:order-2" aria-label="Paginación">

    <!-- Anterior -->
    <button
      (click)="cambiarPagina(paginaActual - 1)"
      [disabled]="paginaActual === 1 || totalRegistros === 0"
      class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 border border-gray-200 bg-white hover:bg-amber-50 hover:text-amber-600 hover:border-amber-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all focus:outline-none focus:ring-2 focus:ring-amber-400">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Números de página -->
    @for (p of paginasMostradas(); track $index) {
      @if (p === '...') {
        <span class="inline-flex items-center justify-center w-8 h-8 text-sm text-gray-400">…</span>
      } @else {
        <button
          (click)="cambiarPagina(p)"
          class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-sm font-semibold transition-all focus:outline-none focus:ring-2 focus:ring-amber-400 border"
          [ngClass]="p === paginaActual
            ? 'bg-amber-500 text-white border-amber-500 shadow-sm'
            : 'bg-white text-gray-600 border-gray-200 hover:bg-amber-50 hover:text-amber-600 hover:border-amber-300'">
          {{ p }}
        </button>
      }
    }

    <!-- Siguiente -->
    <button
      (click)="cambiarPagina(paginaActual + 1)"
      [disabled]="paginaActual === totalPaginas || totalRegistros === 0"
      class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 border border-gray-200 bg-white hover:bg-amber-50 hover:text-amber-600 hover:border-amber-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all focus:outline-none focus:ring-2 focus:ring-amber-400">
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
      </svg>
    </button>

  </nav>

  <!-- Vista Móvil -->
  <div class="flex sm:hidden flex-1 justify-between items-center">
    <button
      (click)="cambiarPagina(paginaActual - 1)"
      [disabled]="paginaActual === 1 || totalRegistros === 0"
      class="px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-200 text-gray-600 hover:bg-amber-50 hover:text-amber-600 hover:border-amber-300 disabled:opacity-40 transition-all">
      ← Anterior
    </button>
    <span class="text-sm text-gray-500 font-medium">
      {{ paginaActual }} / {{ totalPaginas }}
    </span>
    <button
      (click)="cambiarPagina(paginaActual + 1)"
      [disabled]="paginaActual === totalPaginas || totalRegistros === 0"
      class="px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-200 text-gray-600 hover:bg-amber-50 hover:text-amber-600 hover:border-amber-300 disabled:opacity-40 transition-all">
      Siguiente →
    </button>
  </div>

</div>
