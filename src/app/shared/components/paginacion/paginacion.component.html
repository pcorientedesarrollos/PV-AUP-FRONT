<div class="px-4 py-3 bg-slate-50 border-t border-slate-200 sm:flex sm:items-center sm:justify-between rounded-b-lg">
  <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
    <div>
      <p class="text-sm text-slate-700">
        Mostrando
        <span class="font-medium text-slate-900">{{ rangoInicio() }}</span>
        a
        <span class="font-medium text-slate-900">{{ rangoFin() }}</span>
        de
        <span class="font-medium text-slate-900">{{ totalRegistros }}</span>
        resultados
      </p>
    </div>
    <div>
      <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
        <button 
          (click)="cambiarPagina(paginaActual - 1)"
          [disabled]="paginaActual === 1 || totalRegistros === 0"
          class="relative inline-flex items-center rounded-l-md px-2 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed bg-white">
          <span class="sr-only">Anterior</span>
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z" clip-rule="evenodd" />
          </svg>
        </button>

        @for (p of paginasMostradas(); track $index) {
          @if (p === '...') {
            <span class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-slate-700 ring-1 ring-inset ring-slate-300 focus:outline-offset-0 bg-white">...</span>
          } @else {
            <button 
              (click)="cambiarPagina(p)"
              [class.bg-amber-500]="p === paginaActual"
              [class.text-white]="p === paginaActual"
              [class.hover:bg-amber-600]="p === paginaActual"
              [class.z-10]="p === paginaActual"
              [class.bg-white]="p !== paginaActual"
              [class.text-slate-900]="p !== paginaActual"
              [class.hover:bg-slate-50]="p !== paginaActual"
              class="relative inline-flex items-center px-4 py-2 text-sm font-semibold ring-1 ring-inset ring-slate-300 focus:z-20 focus:outline-offset-0 transition-colors">
              {{ p }}
            </button>
          }
        }

        <button 
          (click)="cambiarPagina(paginaActual + 1)"
          [disabled]="paginaActual === totalPaginas || totalRegistros === 0"
          class="relative inline-flex items-center rounded-r-md px-2 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus:z-20 focus:outline-offset-0 disabled:opacity-50 disabled:cursor-not-allowed bg-white">
          <span class="sr-only">Siguiente</span>
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
          </svg>
        </button>
      </nav>
    </div>
  </div>
  
  <!-- Vista Móvil -->
  <div class="flex flex-1 justify-between sm:hidden items-center">
    <button 
      (click)="cambiarPagina(paginaActual - 1)"
      [disabled]="paginaActual === 1 || totalRegistros === 0"
      class="relative inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50">
      Anterior
    </button>
    <span class="text-sm font-medium text-slate-600">
      Pág {{ paginaActual }} de {{ totalPaginas }}
    </span>
    <button 
      (click)="cambiarPagina(paginaActual + 1)"
      [disabled]="paginaActual === totalPaginas || totalRegistros === 0"
      class="relative ml-3 inline-flex items-center rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50">
      Siguiente
    </button>
  </div>
</div>
