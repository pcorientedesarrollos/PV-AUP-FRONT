    <!-- Backdrop oscuro -->
    <div class="modal-backdrop">
      <div class="modal-panel modal-panel-sm animate-[fadeInUp_0.3s_ease-out]">

        <!-- Header del modal -->
        <div class="bg-gradient-to-r from-amber-400 to-amber-600 px-6 py-5">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
              <span class="text-2xl">🏪</span>
            </div>
            <div>
              <h2 class="text-white font-bold text-lg">Apertura de Caja</h2>
              <p class="text-amber-100 text-xs">Registra el monto inicial del turno</p>
            </div>
          </div>
        </div>

        <!-- Cuerpo -->
        <div class="p-6 space-y-5">
          <!-- Info del cajero -->
          <div class="bg-amber-50 rounded-xl p-4 flex items-center gap-3">
            <span class="text-3xl">👤</span>
            <div>
              <p class="text-xs text-amber-600 font-medium uppercase tracking-wider">Cajero</p>
              <p class="text-amber-900 font-bold">{{ nombreCajero }}</p>
            </div>
          </div>

          <!-- Monto -->
          <div class="space-y-2">
            <label class="text-xs font-semibold text-amber-800 uppercase tracking-wider">
              Monto de Apertura
            </label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-amber-500 font-bold text-lg">$</span>
              <input
                id="monto-apertura"
                type="number"
                [(ngModel)]="monto"
                min="0"
                step="0.01"
                placeholder="0.00"
                class="w-full pl-9 pr-4 py-4 border-2 border-amber-200 rounded-xl text-2xl font-bold text-amber-900 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all bg-amber-50 text-right"
              />
            </div>
            <p class="text-xs text-amber-500">Dinero físico con el que inicia la caja (billetes y monedas)</p>
          </div>

          <!-- Error -->
          @if (error()) {
            <div class="bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm">
              ⚠️ {{ error() }}
            </div>
          }

          <!-- Botón -->
          <button
            id="btn-abrir-turno"
            (click)="abrirTurno()"
            [disabled]="cargando()"
            class="w-full py-4 bg-gradient-to-r from-amber-400 to-amber-600 text-white font-bold rounded-xl shadow-lg hover:from-amber-500 hover:to-amber-700 active:scale-95 transition-all disabled:opacity-60 text-base"
          >
            @if (cargando()) {
              <span class="flex items-center justify-center gap-2">
                <svg class="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
                </svg>
                Registrando turno...
              </span>
            } @else {
              🏪 Abrir Caja y Comenzar
            }
          </button>
        </div>
      </div>
    </div>
