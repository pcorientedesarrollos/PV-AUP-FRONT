    <!-- Backdrop -->
    <div class="modal-backdrop">
      <div class="modal-panel modal-panel-sm">

        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-400 to-amber-600 px-6 py-4 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <span class="text-2xl">👤</span>
            <div>
              <h2 class="text-white font-bold">Alta Rápida de Cliente</h2>
              <p class="text-amber-100 text-xs">Solo el nombre es obligatorio</p>
            </div>
          </div>
          <button
            id="btn-cerrar-cliente"
            (click)="cerrar.emit()"
            class="text-white/70 hover:text-white transition-colors text-xl"
          >✕</button>
        </div>

        <!-- Form -->
        <div class="p-6 space-y-4">
          <div class="space-y-1">
            <label class="text-xs font-semibold text-amber-800 uppercase tracking-wider">
              Nombre <span class="text-red-400">*</span>
            </label>
            <input
              id="cliente-nombre"
              type="text"
              [(ngModel)]="form.nombreCompleto"
              placeholder="Nombre completo"
              class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all bg-amber-50"
            />
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-amber-800 uppercase tracking-wider">Domicilio</label>
            <input
              id="cliente-domicilio"
              type="text"
              [(ngModel)]="form.domicilio"
              placeholder="Calle y número (opcional)"
              class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all bg-amber-50"
            />
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-amber-800 uppercase tracking-wider">Teléfono</label>
            <input
              id="cliente-telefono"
              type="tel"
              [(ngModel)]="form.telefono"
              placeholder="10 dígitos (opcional)"
              maxlength="12"
              class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 transition-all bg-amber-50"
            />
          </div>

          @if (error()) {
            <div class="bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm">
              ⚠️ {{ error() }}
            </div>
          }

          <div class="flex gap-3 pt-2">
            <button
              id="btn-cancelar-cliente"
              (click)="cerrar.emit()"
              class="flex-1 py-3 border-2 border-amber-200 text-amber-700 font-semibold rounded-xl hover:bg-amber-50 transition-all"
            >
              Cancelar
            </button>
            <button
              id="btn-guardar-cliente"
              (click)="guardar()"
              [disabled]="cargando()"
              class="flex-1 py-3 bg-gradient-to-r from-amber-400 to-amber-600 text-white font-bold rounded-xl shadow-lg hover:from-amber-500 hover:to-amber-700 active:scale-95 transition-all disabled:opacity-60"
            >
              @if (cargando()) {
                Guardando...
              } @else {
                ✅ Guardar
              }
            </button>
          </div>
        </div>
      </div>
    </div>
