    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
      <div class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-700 border-t-4 border-t-indigo-500">

        <!-- Header -->
        <div class="px-6 py-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800">
          <div class="flex items-center gap-3">
            <span class="text-2xl">👤</span>
            <div>
              <h2 class="text-slate-800 dark:text-white font-bold text-lg">Alta Rápida de Cliente</h2>
              <p class="text-slate-500 dark:text-slate-400 text-xs">Solo el nombre es obligatorio</p>
            </div>
          </div>
          <button
            id="btn-cerrar-cliente"
            (click)="cerrar.emit()"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors text-xl"
          >✕</button>
        </div>

        <!-- Form -->
        <div class="p-6 space-y-4">
          <!-- Botón CSF -->
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Constancia Fiscal (Opcional)</label>
            <div class="flex items-center gap-3">
              <input type="file" accept="application/pdf" #fileInput (change)="onCsfSelected($event)" class="hidden">
              <button type="button" (click)="fileInput.click()" [disabled]="subiendoCsf()"
                      class="flex-1 py-3 border-2 border-dashed border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500 transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                {{ subiendoCsf() ? 'Procesando...' : 'Subir Constancia en PDF' }}
              </button>
            </div>
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              id="cliente-nombre"
              type="text"
              [(ngModel)]="form.nombreCompleto"
              placeholder="Nombre completo"
              class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:focus:ring-indigo-900 transition-all bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
            />
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Domicilio</label>
            <input
              id="cliente-domicilio"
              type="text"
              [(ngModel)]="form.domicilio"
              placeholder="Calle y número (opcional)"
              class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:focus:ring-indigo-900 transition-all bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
            />
          </div>

          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Teléfono</label>
            <input
              id="cliente-telefono"
              type="tel"
              [(ngModel)]="form.telefono"
              placeholder="10 dígitos (opcional)"
              maxlength="12"
              class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:focus:ring-indigo-900 transition-all bg-white dark:bg-slate-800 text-slate-900 dark:text-white"
            />
          </div>

          @if (error()) {
            <div class="bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 text-sm">
              ⚠️ {{ error() }}
            </div>
          }

          <div class="flex gap-3 pt-4">
            <button
              id="btn-cancelar-cliente"
              (click)="cerrar.emit()"
              class="flex-1 py-3 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-all"
            >
              Cancelar
            </button>
            <button
              id="btn-guardar-cliente"
              (click)="guardar()"
              [disabled]="cargando()"
              class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 active:scale-95 transition-all disabled:opacity-60"
            >
              @if (cargando()) {
                Guardando...
              } @else {
                Guardar
              }
            </button>
          </div>
        </div>
      </div>
    </div>
